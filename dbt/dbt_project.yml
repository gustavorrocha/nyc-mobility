name: nyc_mobility
version: "0.1.0"
config-version: 2
profile: nyc_mobility

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

# MVP: tabelas reconstruídas a cada `dbt build`, sem lógica incremental.
models:
  nyc_mobility:
    +materialized: table
    core:
      +schema: core
      # Leitura do dashboard (usuário criado pela migração Alembic 0004); dbt reaplica a cada build.
      zones:
        +grants: {select: [dashboard_reader]}
    analytics:
      +schema: analytics
      +grants: {select: [dashboard_reader]}

seeds:
  nyc_mobility:
    +schema: core
    +grants: {select: [dashboard_reader]}
