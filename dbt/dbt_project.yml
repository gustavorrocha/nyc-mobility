name: nyc_mobility
version: "0.1.0"
config-version: 2
profile: nyc_mobility

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Faixas plausíveis das métricas por corrida (core.trips.metric_issue). Fora delas, a corrida
# conta na demanda mas não entra nas médias. Mudou um limite: dbt build --full-refresh.
vars:
  metric_min_duration_minutes: 1
  metric_max_duration_minutes: 180
  metric_max_distance_miles: 100
  metric_max_speed_mph: 80
  metric_max_total_amount: 1000

# MVP: tabelas reconstruídas a cada `dbt build`, sem lógica incremental.
models:
  nyc_mobility:
    +materialized: table
    core:
      +schema: core
      # Leitura do dashboard (usuário criado pela migração Alembic 0004); dbt reaplica a cada build.
      zones:
        +grants: {select: [dashboard_reader]}
    analytics:
      +schema: analytics
      +grants: {select: [dashboard_reader]}

seeds:
  nyc_mobility:
    +schema: core
    +grants: {select: [dashboard_reader]}
