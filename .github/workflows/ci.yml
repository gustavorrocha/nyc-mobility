name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validar Compose e configurações de monitoramento
        run: |
          cp .env.example .env
          docker compose --profile observability config --quiet
          docker compose --profile observability run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --profile observability run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/alerts_test.yml
          docker compose --profile observability run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Verificar provisionamento real do Grafana
        run: |
          docker compose --profile observability up -d --no-deps grafana
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/api/dashboards/uid/nyc-publication -o /tmp/dashboard.json
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with open('/tmp/dashboard.json') as f:
              dashboard = json.load(f)['dashboard']
          assert len(dashboard['panels']) == 4
          assert all(p['datasource']['uid'] == 'prometheus' for p in dashboard['panels'])
          with urlopen('http://127.0.0.1:3000/api/datasources/uid/prometheus') as response:
              source = json.load(response)
          assert source['url'] == 'http://prometheus:9090'
          PY
      - name: Logs de diagnóstico
        if: failure()
        run: docker compose --profile observability logs --no-color
      - name: Encerrar ambiente descartável do CI
        if: always()
        run: docker compose --profile observability down --volumes

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nyc
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: nyc_mobility
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyc" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais descartáveis, válidas apenas no container de serviço deste job.
      POSTGRES_USER: nyc
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: nyc_mobility
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Inclui `dbt build` (modelos + testes) sobre fixtures ingeridos (tests/test_transform.py).
      - run: uv run pytest -rs
      - run: uv run nyc-mobility db upgrade && uv run nyc-mobility db check

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Somente build: sem push de imagem nem deploy no MVP.
      - run: docker build -f docker/airflow/Dockerfile -t nyc-mobility-airflow:ci .
      - name: DAGs importam sem erros e monthly_pipeline mantém sua estrutura
        run: |
          docker run --rm -v "$PWD/dags:/opt/airflow/dags:ro" nyc-mobility-airflow:ci python -c "
          from airflow.dag_processing.dagbag import DagBag
          b = DagBag('/opt/airflow/dags')
          assert not b.import_errors, b.import_errors
          d = b.dags['monthly_pipeline']
          ingest = {'tlc_taxi_zones', 'tlc_yellow', 'tlc_green', 'tlc_fhv', 'tlc_fhvhv',
                    'openmeteo_era5'}
          up = {t.task_id: t.upstream_task_ids for t in d.tasks}
          assert set(up) == ingest | {'dbt_build', 'summary'}, up
          assert all(not up[t] for t in ingest), up
          assert up['dbt_build'] == ingest, up
          assert 'dbt_build' in up['summary'], up
          assert d.max_active_runs == 1 and d.schedule is None
          t = d.get_task('dbt_build')
          assert t.bash_command.startswith('nyc-mobility build --period')
          assert t.env == {'NYC_PERIOD': '{{ params.period }}'} and t.append_env
          scheduled = b.dags['scheduled_pipeline']
          assert scheduled.schedule == '0 9 * * *' and scheduled.max_active_runs == 1
          assert set(scheduled.task_ids) == {'sync'}
          assert scheduled.get_task('sync').retries == 2
          assert scheduled.params['max_periods'] == 1
          print('monthly_pipeline OK')
          "
