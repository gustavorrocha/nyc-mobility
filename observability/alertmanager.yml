route:
  receiver: local
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local
    email_configs:
      - to: operador@example.test
        from: alertmanager@example.test
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
