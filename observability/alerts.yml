groups:
  - name: nyc-mobility
    rules:
      - alert: UltimoBuildFalhou
        expr: nyc_mobility_build_success == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "O último build concluído falhou"
          description: "Confira a execução e os resultados dbt no Pipeline Health; corrija a falha e reexecute o build."
      - alert: ExportadorIndisponivel
        expr: up{job="nyc_mobility"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus não consegue coletar as métricas do projeto"
          description: "Confira o exportador, sua conexão ao PostgreSQL e o alvo no Prometheus."
